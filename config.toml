base_url = "https://ddostalker.github.io"
title = "dDostalker 的博客"
description = "网安 / 逆向 / CTF 笔记与随笔"
default_language = "zh"
compile_sass = false
build_search_index = false

generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = [
    { name = "tags", feed = false },
    { name = "categories", feed = false },
]

[markdown]
render_emoji = true
external_links_target_blank = true
external_links_no_referrer = true

[markdown.highlighting]
style = "inline"
light_theme = "gruvbox-light-medium"
dark_theme = "gruvbox-dark-medium"

[extra]
author = "dDostalker"
